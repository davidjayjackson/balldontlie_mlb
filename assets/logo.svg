<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182848"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1ECDF"/>
      <stop offset="100%" stop-color="#C9BEA8"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- baseball -->
  <g filter="url(#softShadow)">
    <circle cx="248" cy="256" r="152" fill="url(#ball)" stroke="#D8D2C4" stroke-width="6"/>
    <!-- seams -->
    <path d="M208 108 C118 176 118 336 208 404" stroke="#C8102E" stroke-width="6" fill="none"/>
    <path d="M288 108 C378 176 378 336 288 404" stroke="#C8102E" stroke-width="6" fill="none"/>
    <!-- stitches, left seam -->
    <g fill="#C8102E">
      <circle cx="160" cy="158" r="4"/>
      <circle cx="140" cy="205" r="4"/>
      <circle cx="133" cy="256" r="4"/>
      <circle cx="140" cy="307" r="4"/>
      <circle cx="160" cy="354" r="4"/>
    </g>
    <!-- stitches, right seam -->
    <g fill="#C8102E">
      <circle cx="336" cy="158" r="4"/>
      <circle cx="356" cy="205" r="4"/>
      <circle cx="363" cy="256" r="4"/>
      <circle cx="356" cy="307" r="4"/>
      <circle cx="336" cy="354" r="4"/>
    </g>
    <ellipse cx="200" cy="200" rx="70" ry="50" fill="url(#shine)"/>
  </g>

  <!-- spreadsheet badge, cut into the ball's lower-right edge -->
  <g filter="url(#softShadow)">
    <rect x="286" y="294" width="150" height="150" rx="26" fill="#F5F7FA" stroke="#0F1A30" stroke-width="6"/>
    <g stroke="#93A1B8" stroke-width="4">
      <path d="M286 344 H436"/>
      <path d="M286 394 H436"/>
      <path d="M336 294 V444"/>
      <path d="M386 294 V444"/>
    </g>
    <!-- active cell highlight -->
    <rect x="336" y="344" width="50" height="50" fill="#C8102E" opacity="0.92"/>
  </g>
</svg>
